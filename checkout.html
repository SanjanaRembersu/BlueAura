<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - BlueAura</title>
  <link rel="icon" href="favicon.png" type="image/png" />
  <link rel="stylesheet" href="style.css" />
  <style>
    /* ==========================================================================
       CHECKOUT PAGE (BLUEAURA PREMIUM DARK THEME)
       ========================================================================== */
    body {
      background-color: #060b17;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Navbar */
    .navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-logo span {
      font-size: 1.5rem;
      font-weight: 800;
      color: #38bdf8;
      letter-spacing: 1px;
    }

    .nav-links a {
      color: #cbd5e1;
      text-decoration: none;
      margin-left: 20px;
      font-weight: 600;
      transition: color 0.3s ease;
    }

    .nav-links a:hover {
      color: #38bdf8;
    }

    /* Main Container */
    .checkout-container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px;
      width: 100%;
      box-sizing: border-box;
      flex: 1;
    }

    .page-title {
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 30px;
      color: #ffffff;
      letter-spacing: -0.5px;
    }

    /* Layout Grid: Form + Order Preview */
    .checkout-grid {
      display: grid;
      grid-template-columns: 1fr 380px;
      gap: 30px;
      align-items: start;
    }

    /* Glassmorphism Form Card */
    .checkout-form-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 35px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #94a3b8;
      margin-bottom: 8px;
    }

    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px 16px;
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      color: #ffffff;
      font-size: 0.95rem;
      outline: none;
      box-sizing: border-box;
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
      font-family: inherit;
    }

    .form-group input:focus,
    .form-group textarea:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.3);
    }

    .form-group input::placeholder,
    .form-group textarea::placeholder {
      color: #64748b;
    }

    /* Order Summary Card */
    .summary-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 25px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
      position: sticky;
      top: 100px;
    }

    .summary-card h3 {
      font-size: 1.3rem;
      margin: 0 0 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }

    /* Summary Items List */
    .summary-items-list {
      max-height: 240px;
      overflow-y: auto;
      margin-bottom: 20px;
      padding-right: 5px;
    }

    .summary-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 0.9rem;
    }

    .summary-item-name {
      color: #ffffff;
      font-weight: 600;
      margin: 0;
    }

    .summary-item-meta {
      color: #94a3b8;
      font-size: 0.8rem;
    }

    .summary-item-price {
      color: #38bdf8;
      font-weight: 700;
      white-space: nowrap;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 0.95rem;
      color: #cbd5e1;
    }

    .summary-row.total {
      font-size: 1.25rem;
      font-weight: 800;
      color: #ffffff;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .summary-row.total span:last-child {
      color: #38bdf8;
    }

    /* Place Order Button */
    .btn-place-order {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
      border: none;
      color: #ffffff;
      border-radius: 30px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 20px;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn-place-order:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(37, 211, 102, 0.5);
    }

    /* Empty Cart Banner inside Checkout */
    .checkout-empty {
      text-align: center;
      padding: 40px 20px;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      backdrop-filter: blur(12px);
    }

    .checkout-empty h3 {
      font-size: 1.5rem;
      color: #ffffff;
      margin-bottom: 10px;
    }

    .checkout-empty p {
      color: #94a3b8;
      margin-bottom: 20px;
    }

    .btn-browse {
      display: inline-block;
      padding: 12px 28px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    .btn-browse:hover {
      background: rgba(255, 255, 255, 0.2);
      color: #38bdf8;
    }

    /* Footer */
    .site-footer {
      background: rgba(15, 23, 42, 0.9);
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding: 40px 20px;
      margin-top: 80px;
      text-align: center;
    }

    .footer-brand {
      font-size: 1.5rem;
      font-weight: 800;
      color: #38bdf8;
      margin-bottom: 15px;
    }

    .footer-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
    }

    .footer-links a {
      color: #cbd5e1;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .footer-copy {
      color: #64748b;
      font-size: 0.85rem;
      margin: 0;
    }

    /* Responsive */
    @media (max-width: 850px) {
      .checkout-grid {
        grid-template-columns: 1fr;
      }
      .summary-card {
        position: static;
      }
    }
  </style>
</head>
<body>

<header class="navbar">
  <div class="brand-logo">
    <span>BlueAura</span>
  </div>
  <nav class="nav-links">
    <a href="index.html">Home</a>
    <a href="cart.html">Cart</a>
  </nav>
</header>

<main class="checkout-container">
  <h1 class="page-title">Checkout</h1>

  <div id="checkout-content">
    <!-- Rendered dynamically -->
  </div>
</main>

<footer class="site-footer">
  <div class="footer-content">
    <p class="footer-brand">BlueAura</p>
    <nav class="footer-links">
      <a href="index.html">Home</a>
      <a href="index.html#products">Products</a>
      <a href="index.html#about">About</a>
      <a href="index.html#contact">Contact</a>
    </nav>
    <p class="footer-copy">© 2026 BlueAura. Designed by Sanjana Rembersu.</p>
  </div>
</footer>

<script>
  let cartItems = JSON.parse(localStorage.getItem("cart")) || [];

  // Parse raw number or formatted price string e.g. "₹1,199"
  function parsePrice(price) {
    if (typeof price === 'number') return price;
    if (typeof price === 'string') {
      const cleanStr = price.replace(/[^0-9.]/g, '');
      return parseFloat(cleanStr) || 0;
    }
    return 0;
  }

  function renderCheckout() {
    const container = document.getElementById("checkout-content");

    if (!cartItems || cartItems.length === 0) {
      container.innerHTML = `
        <div class="checkout-empty">
          <h3>Your cart is empty</h3>
          <p>Please add items to your cart before proceeding to checkout.</p>
          <a href="index.html" class="btn-browse">Explore Collections</a>
        </div>
      `;
      return;
    }

    let subtotal = 0;
    let itemsPreviewHTML = cartItems.map((item) => {
      const unitPrice = parsePrice(item.price);
      const qty = parseInt(item.quantity, 10) || 1;
      const itemTotal = unitPrice * qty;
      subtotal += itemTotal;

      return `
        <div class="summary-item">
          <div>
            <p class="summary-item-name">${item.name}</p>
            <div class="summary-item-meta">${item.size || 'M'} | ${item.color || 'Standard'} | Qty: ${qty}</div>
          </div>
          <span class="summary-item-price">₹${itemTotal.toLocaleString('en-IN')}</span>
        </div>
      `;
    }).join('');

    const shipping = subtotal > 1999 ? 0 : 99;
    const grandTotal = subtotal + shipping;

    container.innerHTML = `
      <div class="checkout-grid">
        <!-- Customer Info Form -->
        <div class="checkout-form-card">
          <form onsubmit="sendOrder(event)">
            <div class="form-group">
              <label for="name">Full Name *</label>
              <input type="text" id="name" placeholder="e.g. Sanjana Rembersu" required>
            </div>

            <div class="form-group">
              <label for="phone">Phone Number *</label>
              <input type="tel" id="phone" placeholder="e.g. +91 98765 43210" required>
            </div>

            <div class="form-group">
              <label for="email">Email Address</label>
              <input type="email" id="email" placeholder="e.g. sanjana@example.com">
            </div>

            <div class="form-group">
              <label for="address">Delivery Address *</label>
              <textarea id="address" rows="3" placeholder="Flat No., Street, City, State, Pincode" required></textarea>
            </div>

            <div class="form-group">
              <label for="note">Additional Notes (Optional)</label>
              <textarea id="note" rows="2" placeholder="Special delivery instructions, landmark, etc."></textarea>
            </div>

            <button type="submit" class="btn-place-order">
              <span>Place Order via WhatsApp</span>
            </button>
          </form>
        </div>

        <!-- Order Summary Side Panel -->
        <div class="summary-card">
          <h3>Order Items</h3>
          
          <div class="summary-items-list">
            ${itemsPreviewHTML}
          </div>

          <div class="summary-row">
            <span>Subtotal</span>
            <span>₹${subtotal.toLocaleString('en-IN')}</span>
          </div>
          <div class="summary-row">
            <span>Shipping</span>
            <span>${shipping === 0 ? '<span style="color:#25d366;">FREE</span>' : '₹' + shipping}</span>
          </div>

          <div class="summary-row total">
            <span>Total Amount</span>
            <span>₹${grandTotal.toLocaleString('en-IN')}</span>
          </div>
        </div>
      </div>
    `;
  }

  function sendOrder(e) {
    e.preventDefault();

    if (!cartItems || cartItems.length === 0) {
      alert("Your cart is empty.");
      return;
    }

    const name = document.getElementById("name").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const email = document.getElementById("email").value.trim() || 'N/A';
    const address = document.getElementById("address").value.trim();
    const note = document.getElementById("note").value.trim() || 'None';

    let message = `Hi BlueAura, I want to place an order:\n\n👤 *Customer Details:*\n• Name: ${name}\n• Phone: ${phone}\n• Email: ${email}\n• Address: ${address}\n• Note: ${note}\n\n🛍️ *Order Summary:*\n`;

    let subtotal = 0;
    cartItems.forEach((item, i) => {
      const unitPrice = parsePrice(item.price);
      const qty = parseInt(item.quantity, 10) || 1;
      const itemTotal = unitPrice * qty;
      subtotal += itemTotal;

      message += `${i + 1}. ${item.name} (${item.size || 'M'}, ${item.color || 'Standard'}, Qty: ${qty}) - ₹${itemTotal.toLocaleString('en-IN')}\n`;
    });

    const shipping = subtotal > 1999 ? 0 : 99;
    const grandTotal = subtotal + shipping;

    message += `\nSubtotal: ₹${subtotal.toLocaleString('en-IN')}\nShipping: ${shipping === 0 ? 'FREE' : '₹' + shipping}\n*Grand Total: ₹${grandTotal.toLocaleString('en-IN')}*`;

    const phoneNumber = "919561461687";
    const encoded = encodeURIComponent(message);
    const whatsappURL = `https://wa.me/${phoneNumber}?text=${encoded}`;

    // Open WhatsApp
    window.open(whatsappURL, "_blank");

    // Clear cart
    localStorage.setItem("cart", JSON.stringify([]));

    // Redirect to Thank You page after 2 seconds
    setTimeout(() => {
      window.location.href = "thankyou.html";
    }, 2000);
  }

  document.addEventListener("DOMContentLoaded", renderCheckout);
</script>

</body>
</html>
